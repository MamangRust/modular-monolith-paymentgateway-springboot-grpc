apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../../base/card

# GHCR image owner templating (mirrors the aggregate production overlay):
# the base manifests reference ghcr.io/__GHCR_OWNER__/springboot-payment-gateway/card,
# and this overlay pins the tag + substitutes the real owner for this module.
# On a fork, change the owner segment below to your GHCR owner.
images:
- name: ghcr.io/__GHCR_OWNER__/springboot-payment-gateway/card
  newName: ghcr.io/mamangrust/springboot-payment-gateway/card
  newTag: latest

patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: card
    spec:
      template:
        spec:
          imagePullSecrets:
          - name: ghcr-pull-secret
  target:
    group: apps
    version: v1
    kind: Deployment
    name: card
